name: publish

# Puts the reader on PyPI (pip install htpd-reader) when a release is published,
# then lists its MCP server in the official MCP registry (server.json).
# It uses PyPI's trusted publishing: no password or token is stored in GitHub.
# One-time setup on pypi.org: Publishing > add a pending publisher with
# owner narendrachampaneri, repository htpd, workflow publish.yml, environment pypi.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build the package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check --strict dist/*
      - name: Try the wheel in a clean environment
        run: |
          python -m venv /tmp/try
          /tmp/try/bin/pip install dist/*.whl
          /tmp/try/bin/htpd-read ask examples/single-file/sample.htpd "What is the maximum bus voltage?"
      - uses: actions/upload-artifact@v5
        with:
          name: dist
          path: dist/

  pypi:
    name: Publish on PyPI
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/htpd-reader/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  mcp-registry:
    name: List the MCP server in the MCP registry
    needs: pypi
    runs-on: ubuntu-24.04
    permissions:
      id-token: write   # the registry knows the repository by GitHub's token: no secret
      contents: read
    steps:
      - uses: actions/checkout@v5
      - name: Install mcp-publisher
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
      - name: Publish server.json (PyPI may need a minute to show the new version)
        run: |
          ./mcp-publisher login github-oidc
          for i in 1 2 3 4 5; do ./mcp-publisher publish && exit 0; sleep 60; done
          exit 1
