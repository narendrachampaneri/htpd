name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  converter:
    name: Converter (C++)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Get PDFium
        run: ./scripts/get_pdfium.sh
      - name: Build (Makefile)
        run: make
      - name: C++ tests (without OCR)
        run: make test
      - name: Install Tesseract (the OCR tests run with it)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-eng
      - name: Build and test (CMake, with OCR)
        run: |
          cmake -S . -B build-cmake
          cmake --build build-cmake -j
          ctest --test-dir build-cmake --output-on-failure

  reader:
    name: Reader (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -e ".[yaml]"
      - name: Python tests
        run: |
          for d in reader eval model; do
            PYTHONPATH=reader:. python -m unittest discover -s $d/tests -t .
          done
      - name: Python tests without PyYAML (as in a chat sandbox)
        run: |
          for d in reader eval model; do
            HTPD_NO_YAML=1 PYTHONPATH=reader:. python -m unittest discover -s $d/tests -t .
          done
      - name: Ask the sample file
        run: |
          htpd-read ask examples/single-file/sample.htpd "What is the maximum bus voltage?"
          htpd-read check examples/single-file/sample.htpd
      - name: Build the skill
        run: python scripts/build_skill.py

  package:
    name: Package and plugin
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build the pip package and try it in a clean environment
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check --strict dist/*
          python -m venv /tmp/try
          /tmp/try/bin/pip install dist/*.whl
          /tmp/try/bin/htpd-read ask examples/single-file/sample.htpd "What is the maximum bus voltage?"
      - name: The plugin's MCP server starts and lists its tools
        run: |
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}' \
                         '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' \
            | python3 skills/htpd/scripts/htpd.py mcp --bundles examples | grep -q '"name": "ask"'
      - name: The plugin's files are valid JSON
        run: python3 -m json.tool .claude-plugin/plugin.json >/dev/null && python3 -m json.tool .claude-plugin/marketplace.json >/dev/null
