<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="340" viewBox="0 0 1280 340" role="img" aria-label="HTPD - Hyper Text Portable Document">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f3f7ff"/>
      <stop offset="1" stop-color="#eef6f2"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1d4ed8"/>
      <stop offset="1" stop-color="#0f766e"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#1e3a8a" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="1280" height="340" rx="24" fill="url(#bg)"/>
  <circle cx="1190" cy="40" r="120" fill="#dbeafe" opacity="0.55"/>
  <circle cx="1120" cy="330" r="90" fill="#ccfbf1" opacity="0.6"/>

  <!-- logo: a page with sections and a page mark -->
  <g transform="translate(96,62)" filter="url(#shadow)">
    <path d="M0 16 a16 16 0 0 1 16 -16 h118 l50 50 v150 a16 16 0 0 1 -16 16 h-152 a16 16 0 0 1 -16 -16z" fill="#ffffff" stroke="#c7d2fe" stroke-width="2"/>
    <path d="M134 0 v34 a16 16 0 0 0 16 16 h34" fill="#e0e7ff"/>
    <rect x="22" y="30" width="78" height="12" rx="6" fill="url(#ink)"/>
    <rect x="22" y="58" width="132" height="8" rx="4" fill="#cbd5e1"/>
    <rect x="22" y="74" width="112" height="8" rx="4" fill="#cbd5e1"/>
    <rect x="22" y="98" width="60" height="10" rx="5" fill="#0f766e"/>
    <rect x="22" y="120" width="140" height="8" rx="4" fill="#cbd5e1"/>
    <rect x="22" y="136" width="96" height="8" rx="4" fill="#cbd5e1"/>
    <rect x="22" y="164" width="44" height="22" rx="11" fill="#1d4ed8"/>
    <text x="44" y="180" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">p.18</text>
  </g>

  <text x="330" y="148" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="96" font-weight="800" fill="url(#ink)" letter-spacing="2">HTPD</text>
  <text x="334" y="196" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="30" font-weight="600" fill="#1e293b">Hyper Text Portable Document</text>
  <text x="334" y="240" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="21" fill="#475569">Long PDFs, made for AI: exact answers with page numbers - or "Not found in this file."</text>

  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="600">
    <rect x="334" y="268" width="168" height="34" rx="17" fill="#ffffff" stroke="#bfdbfe"/>
    <text x="418" y="290" fill="#1d4ed8" text-anchor="middle">C++23 converter</text>
    <rect x="514" y="268" width="168" height="34" rx="17" fill="#ffffff" stroke="#bfdbfe"/>
    <text x="598" y="290" fill="#1d4ed8" text-anchor="middle">Plugin · MCP · pip</text>
    <rect x="694" y="268" width="150" height="34" rx="17" fill="#ffffff" stroke="#99f6e4"/>
    <text x="769" y="290" fill="#0f766e" text-anchor="middle">100 % local</text>
    <rect x="856" y="268" width="150" height="34" rx="17" fill="#ffffff" stroke="#99f6e4"/>
    <text x="931" y="290" fill="#0f766e" text-anchor="middle">No GPU needed</text>
  </g>
</svg>
