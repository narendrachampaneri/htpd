[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "htpd-reader"
version = "0.1.2"
description = "The HTPD reader: read HTPD files and find the exact text, with pages, that answers a question."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Narendra Champaneri" }]
keywords = ["pdf", "htpd", "documents", "ai", "llm", "rag", "mcp", "datasheet"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Text Processing :: Indexing",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# The reader needs only the standard library. PyYAML, when installed, reads the fields a little faster.
dependencies = []

[project.optional-dependencies]
yaml = ["PyYAML>=5.4"]

[project.urls]
Homepage = "https://github.com/narendrachampaneri/htpd"
Documentation = "https://github.com/narendrachampaneri/htpd/blob/main/docs/READER.md"
Source = "https://github.com/narendrachampaneri/htpd"
Issues = "https://github.com/narendrachampaneri/htpd/issues"

[project.scripts]
htpd-read = "htpd_reader.cli:main"
htpd-mcp = "htpd_reader.mcp:main"

[tool.setuptools.packages.find]
where = ["reader"]
include = ["htpd_reader*"]

[tool.setuptools.package-data]
htpd_reader = ["rerank.json"]  # the weights of the re-ranker

[tool.pytest.ini_options]
# The Python tests (reader, evaluation, re-ranker training). They are plain unittest tests, so
# `python -m unittest discover -s reader/tests -t .` runs them as well.
testpaths = ["reader/tests", "eval/tests", "model/tests"]
pythonpath = ["reader", "."]
