[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "htpd-reader"
version = "0.1.1"
description = "The HTPD reader: read HTPD files and find the exact text, with pages, that answers a question."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Narendra Champaneri" }]
dependencies = ["PyYAML>=5.4"]

[project.scripts]
htpd-read = "htpd_reader.cli:main"
htpd-mcp = "htpd_reader.mcp:main"

[tool.setuptools.packages.find]
where = ["reader"]
include = ["htpd_reader*"]

[tool.setuptools.package-data]
htpd_reader = ["rerank.json"]  # the weights of the re-ranker

[tool.pytest.ini_options]
# The Python tests (reader, evaluation, re-ranker training). They are plain unittest tests, so
# `python -m unittest discover -s reader/tests -t .` runs them as well.
testpaths = ["reader/tests", "eval/tests", "model/tests"]
pythonpath = ["reader", "."]
